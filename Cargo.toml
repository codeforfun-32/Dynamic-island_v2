[package]
name = "v1-dynamic-island"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.9", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
arboard = "3"
cpal = "0.15"
ureq = "2"
serde_json = "1"
sysinfo = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Radios",
    "Media",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true